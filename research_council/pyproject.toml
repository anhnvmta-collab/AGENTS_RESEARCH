[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "research-council"
version = "1.0.0"
description = "Evidence-first scientific research workflow"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "typer>=0.15,<1", "rich>=13.9,<15", "httpx>=0.28,<1",
  "PyYAML>=6.0.2,<7", "python-dotenv>=1.0.1,<2", "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
research-council = "research_council.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research_council"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
